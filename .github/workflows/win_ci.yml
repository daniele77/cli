
name: CI windows

on: [push, pull_request]

jobs:
  Test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        compiler: [clang++-15, msvc]
        standard: [14, 23]
        build_type: [Release, Debug]
        asio_library: [boost, standalone, none]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          vcvarsall: true
          cmake: true
          ninja: true
          vcpkg: false
          ccache: true
          clangtidy: true
          cppcheck: true
          gcovr: true
          opencppcoverage: true

      - name: Install Boost dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"

          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone vcpkg"
          }

          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to bootstrap vcpkg"
          }

          & "$vcpkgRoot/vcpkg.exe" install `
            boost-system `
            boost-date-time `
            boost-test `
            --triplet x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Boost dependencies"
          }

          "VCPKG_ROOT=$vcpkgRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "$vcpkgRoot/installed/x64-windows/bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Download standalone Asio only when required.
      - name: Install standalone Asio
        if: matrix.asio_library == 'standalone'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://github.com/chriskohlhoff/asio/archive/refs/tags/asio-1-18-2.zip `
            -OutFile asio.zip

          tar -xf asio.zip
          Move-Item asio-asio-1-18-2 asio

      - name: Configure CMake
        shell: pwsh
        run: |
          $UseBoostAsio = "${{ matrix.asio_library }}" -eq "boost"
          $UseStandaloneAsio = "${{ matrix.asio_library }}" -eq "standalone"

          $CMakeArgs = @(
            "-S", ".",
            "-B", "./build",
            "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}",
            "-DCMAKE_CXX_STANDARD=${{ matrix.standard }}",
            "-DCLI_BuildTests=ON",
            "-DCLI_BuildExamples=ON",
            "-DCLI_UseBoostAsio=$($UseBoostAsio)",
            "-DCLI_UseStandaloneAsio=$($UseStandaloneAsio)",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DBoost_ROOT=$env:VCPKG_ROOT/installed/x64-windows",
            "-DBOOST_ROOT=$env:VCPKG_ROOT/installed/x64-windows"
          )

          if ($UseStandaloneAsio) {
            $AsioPath = Join-Path $env:GITHUB_WORKSPACE "asio/asio/include"
            $AsioPath = $AsioPath -replace "\\", "/"

            Write-Host "ASIO path: $AsioPath"

            if (!(Test-Path $AsioPath)) {
              throw "Standalone Asio include directory not found"
            }

            $CMakeArgs += "-DASIO_INCLUDEDIR=$AsioPath"
          }

          cmake @CMakeArgs

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed"
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build ./build --config ${{ matrix.build_type }} --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed"
          }

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir ./build `
            -C ${{ matrix.build_type }} `
            --output-on-failure

          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed"
          }
